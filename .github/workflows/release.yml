name: Release

# Push a vX.Y.Z tag to cut a release:
#   bump version in package.json -> commit -> git tag vX.Y.Z && git push origin vX.Y.Z
# Builds the Windows installer, the macOS (universal) dmg/zip, and the Linux AppImage/deb, code-signs
# them where possible, and publishes them to GitHub Releases. Installed apps pick up the new version
# through electron-updater.
#
# The shape is validate -> {windows, macos, linux} -> publish. Publish is a separate job because every
# platform's assets must land before the release goes public — latest.yml / latest-mac.yml /
# latest-linux.yml are the update feeds, so a release with only some platforms' assets attached would
# advertise an installer that does not exist yet.
#
# Code signing is FAIL-OPEN on Windows and macOS: when the relevant secrets/variables are not
# configured the signing steps are skipped and the release ships unsigned, exactly as before. Once
# signing is attempted, however, it is FAIL-CLOSED: a signing or notarization failure fails the build
# rather than shipping a half-signed release. Linux has no signing path at all — the AppImage and the
# deb ship unsigned, which is what that distribution channel expects.
#
# Windows (SignPath, docs/releasing.md has the full walkthrough):
#   secret   SIGNPATH_API_TOKEN            - SignPath REST API token
#   variable SIGNPATH_ORGANIZATION_ID      - from the SignPath organization page
#   variable SIGNPATH_PROJECT_SLUG         - the SignPath project (e.g. astera)
#   variable SIGNPATH_POLICY_SLUG          - optional, defaults to release-signing
# macOS (Apple Developer ID):
#   secret   APPLE_CSC_LINK                - base64 of the Developer ID Application .p12
#   secret   APPLE_CSC_KEY_PASSWORD        - password for that .p12
#   secret   APPLE_ID                      - Apple account used for notarization
#   secret   APPLE_APP_SPECIFIC_PASSWORD   - app-specific password for that account
#   secret   APPLE_TEAM_ID                 - Developer Team ID
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write # creating the release and uploading its assets
  actions: read # the SignPath connector fetches the unsigned artifact through the Actions API

jobs:
  # Tag and policy validation only need to run once, regardless of which platforms get built. It must
  # fail before any platform build starts, so we don't waste runner time on a build that was doomed
  # anyway. This stays on a windows-latest runner because the two steps below are pwsh, unchanged from
  # when they lived in the windows job.
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # electron-updater decides whether an update exists by comparing versions, so a tag that
      # disagrees with package.json would advertise the wrong version. Fail before building.
      - name: Verify tag matches package.json version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "v$version") {
            throw "Tag ($tag) does not match package.json version ($version). Push the tag 'v$version'."
          }
          Write-Host "Building v$version (tag $tag)"

      # The dangerous misconfiguration is a `block` campaign whose range covers the release being
      # published: everyone gets locked out and there is no newer build to escape to. So `block`
      # requires a maxVersion, and that bound must sit below this release. A campaign with no range at
      # all targets every version, which is never intentional.
      - name: Validate update campaign policy
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not (Test-Path policy.json)) { Write-Host 'No policy.json — no campaign'; exit 0 }
          try { $policy = Get-Content policy.json -Raw | ConvertFrom-Json }
          catch { throw "policy.json failed to parse: $($_.Exception.Message)" }
          if (-not $policy.id) { Write-Host 'Update campaign: none (id=null)'; exit 0 }
          $min = $policy.minVersion
          $max = $policy.maxVersion
          $mode = if ($policy.mode) { $policy.mode } else { 'notify' }
          if (-not $min -and -not $max) {
            throw "Campaign '$($policy.id)' has no target range. Without one, every version is targeted — set minVersion or maxVersion."
          }
          if ($min -and $max -and ([version]$min -gt [version]$max)) {
            throw "policy.json range is inverted: minVersion ($min) > maxVersion ($max)"
          }
          if ($mode -eq 'block') {
            if (-not $max) {
              throw "block mode requires maxVersion. With no upper bound, users on the newest release are blocked too."
            }
            if (-not ([version]$max -lt [version]$version)) {
              throw "block mode maxVersion ($max) must be lower than the release version ($version). Otherwise the newest users are locked out with no update to take."
            }
            Write-Host "Update campaign: block (id=$($policy.id), targets <= $max, below this release $version — OK)"
          } else {
            if ($max -and -not ([version]$max -lt [version]$version)) {
              Write-Host "::warning::notify campaign maxVersion ($max) is at or above the release version ($version) — users on the newest build will see the notice too."
            }
            Write-Host "Update campaign: notify (id=$($policy.id))"
          }

  windows:
    needs: validate
    runs-on: windows-latest
    env:
      # Signing engages only when the token and the organization id are both present. Forks and local
      # checkouts have neither, so their builds behave exactly like the pre-signing workflow.
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      # Must match ci.yml: @electron/rebuild and node-abi require >=22.12.0.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Stage 1 of the build: bundle and produce the unpacked app (dist-installer/win-unpacked). The
      # installer it also emits here is a throwaway — stage 2 reassembles it from the signed binaries
      # and overwrites it, which is the whole point of splitting the build.
      #
      # Do NOT put --dir back to skip that throwaway. electron-builder writes
      # resources/app-update.yml from onAfterPack, and only when the build carries a suitable Windows
      # target (nsis) — a --dir build's target is 'dir', and --prepackaged skips packing altogether,
      # so with --dir in place NEITHER stage ever wrote the file. electron-updater reads it to learn
      # which repository to check, so every update check died with ENOENT. That is what shipped in
      # every Windows release from v1.0.0 through v1.1.0.
      - name: Build unpacked app
        shell: pwsh
        run: |
          npm run build
          npx electron-builder --win --publish never

      # ---- Signing stage 1: the binaries inside the package -------------------------------------
      # Everything already carrying a valid Authenticode signature (Microsoft's conpty/OpenConsole,
      # d3dcompiler and so on) is left untouched — re-signing would replace the vendor's signature.
      # The rest (Astera.exe, Electron DLLs, node-pty builds, elevate.exe) is zipped with relative
      # paths preserved and submitted as one signing request.
      - name: Collect unsigned binaries
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $base = 'dist-installer/win-unpacked'
          $stage = 'dist-installer/signing-stage'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $files = Get-ChildItem $base -Recurse -Include *.exe,*.dll,*.node -File |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if (-not $files) { throw 'No unsigned binaries found — nothing to sign, which cannot be right.' }
          foreach ($f in $files) {
            $rel = [System.IO.Path]::GetRelativePath((Resolve-Path $base), $f.FullName)
            $dest = Join-Path $stage $rel
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            Copy-Item $f.FullName $dest
          }
          # The relative-path list drives the verification step after signing.
          $files | ForEach-Object {
            [System.IO.Path]::GetRelativePath((Resolve-Path $base), $_.FullName)
          } | Set-Content dist-installer/signing-manifest.txt
          Compress-Archive -Path "$stage/*" -DestinationPath dist-installer/unsigned-binaries.zip -CompressionLevel Optimal
          Write-Host "Collected $($files.Count) binaries for signing"

      - name: Upload unsigned binaries artifact
        if: env.SIGNING == 'true'
        id: upload-binaries
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-binaries-${{ github.run_id }}
          path: dist-installer/unsigned-binaries.zip
          retention-days: 1

      # wait-for-completion blocks until the signing request is approved and processed. SignPath
      # release policies typically require a manual approval, so the timeout is generous — approve
      # the request in the SignPath dashboard while this step waits.
      - name: 'SignPath: sign binaries'
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-binaries-zip
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-installer/signed-binaries

      # Fail-closed from here: signing was attempted, so every file in the manifest must now carry a
      # valid signature — a partially signed package must never reach the installer step.
      - name: Apply signed binaries
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $base = 'dist-installer/win-unpacked'
          $signedRoot = 'dist-installer/signed-binaries'
          # The signed artifact mirrors what was submitted: either the zip itself or its extracted
          # tree, depending on connector behaviour. Handle both.
          $zip = Get-ChildItem $signedRoot -Recurse -Filter *.zip -File | Select-Object -First 1
          if ($zip) { Expand-Archive $zip.FullName -DestinationPath $signedRoot -Force }
          $manifest = Get-Content dist-installer/signing-manifest.txt
          # The zip was built from the staging tree, so the extracted output contains the manifest's
          # relative paths under SOME root. Locate that root by probing for the first entry, then copy
          # everything by its manifest path — no fuzzy filename matching.
          $roots = @(Get-Item $signedRoot) + @(Get-ChildItem $signedRoot -Recurse -Directory)
          $root = $roots | Where-Object { Test-Path (Join-Path $_.FullName $manifest[0]) } | Select-Object -First 1
          if (-not $root) { throw "Signed artifact does not contain '$($manifest[0])' under any directory" }
          $missing = @()
          foreach ($rel in $manifest) {
            $src = Join-Path $root.FullName $rel
            if (-not (Test-Path $src)) { $missing += $rel; continue }
            Copy-Item $src (Join-Path $base $rel) -Force
          }
          if ($missing) { throw "Signed artifact is missing: $($missing -join ', ')" }
          $unsigned = $manifest | Where-Object {
            (Get-AuthenticodeSignature (Join-Path $base $_)).Status -ne 'Valid'
          }
          if ($unsigned) { throw "Still unsigned after SignPath: $($unsigned -join ', ')" }
          Write-Host "All $($manifest.Count) binaries verified signed"

      # Stage 2 of the build: assemble the NSIS installer from the (now possibly signed) unpacked
      # directory. This also writes latest.yml and the .blockmap — from the installer as it exists at
      # this moment, i.e. before the installer itself is signed.
      - name: Build installer
        shell: pwsh
        run: npx electron-builder --win --prepackaged dist-installer/win-unpacked --publish never

      # ---- Signing stage 2: the installer itself -------------------------------------------------
      - name: Upload unsigned installer artifact
        if: env.SIGNING == 'true'
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer-${{ github.run_id }}
          path: dist-installer/*-setup.exe
          retention-days: 1

      - name: 'SignPath: sign installer'
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-installer/signed-installer

      # Signing changed the installer's bytes, so the update feed electron-builder wrote a step ago
      # (sha512 + size in latest.yml, and the differential-download .blockmap) no longer matches —
      # an updater would download the file and reject it. Regenerate both from the signed file.
      - name: Apply signed installer and patch update feed
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem dist-installer/signed-installer -Recurse -Filter *-setup.exe -File | Select-Object -First 1
          if (-not $signed) { throw 'Signed installer not found in the SignPath output' }
          $target = Get-ChildItem dist-installer -Filter *-setup.exe -File | Select-Object -First 1
          Copy-Item $signed.FullName $target.FullName -Force
          $sig = Get-AuthenticodeSignature $target.FullName
          if ($sig.Status -ne 'Valid') { throw "Installer signature is $($sig.Status) after SignPath" }
          Write-Host "Installer signed by: $($sig.SignerCertificate.Subject)"
          node scripts/patch-update-feed.cjs $target.FullName dist-installer/latest.yml

      # Publishing happens in the publish job, once it has both platforms' assets. This job only
      # hands its assets off.
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            dist-installer/*-setup.exe
            dist-installer/*-setup.exe.blockmap
            dist-installer/latest.yml
          retention-days: 1

  macos:
    needs: validate
    runs-on: macos-latest
    env:
      # Fail-open like Windows's SignPath: forks without the secrets fall back to an ad-hoc signature
      # instead of a Developer ID. Once the secrets are present it flips to fail-closed — a signing or
      # notarization failure kills the build.
      SIGNING: ${{ secrets.APPLE_CSC_LINK != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Signed path. electron-builder builds a temporary keychain from CSC_LINK to sign the app, then
      # hands off to notarytool to notarize it. No need to split this into two stages like Windows —
      # unlike SignPath there is no approval wait, so signing finishes during packaging.
      - name: Build signed and notarized package
        if: env.SIGNING == 'true'
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build
          npx electron-builder --mac --publish never

      # No-Developer-ID path (forks, or secrets not configured). Turns off notarization and automatic
      # certificate discovery — without the latter, electron-builder would grab some unrelated
      # certificate from the runner's keychain and fail trying to sign with it.
      #
      # identity=- is ad-hoc signing, and it is not optional here: Apple Silicon refuses to execute
      # arm64 code that carries no signature at all, and that refusal is a kernel check with no
      # Gatekeeper-style override. Without it the universal package would not merely warn on first
      # launch — it would fail to open on every Apple Silicon Mac. electron-builder only signs
      # ad-hoc when the identity is explicitly '-'; with the identity left unset it skips signing
      # entirely (app-builder-lib MacTargetHelper.findSigningIdentity).
      #
      # Ad-hoc signatures cannot be notarized and Squirrel.Mac rejects unsigned updates, so this
      # path still means no auto-update — it buys a launchable app, not a releasable one.
      - name: Build ad-hoc signed package
        if: env.SIGNING != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          npx electron-builder --mac --publish never -c.mac.notarize=false -c.mac.identity=-

      # Fail-closed once signing was attempted: verify the notarization ticket is actually stapled,
      # and die if not. A half-signed release shipping is worse than an unsigned one.
      - name: Verify notarization
        if: env.SIGNING == 'true'
        run: |
          app=$(find dist-installer -maxdepth 2 -name 'Astera.app' -print -quit)
          if [ -z "$app" ]; then echo "Astera.app not found in dist-installer" >&2; exit 1; fi
          spctl -a -vvv -t install "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"

      # The ad-hoc signature is what makes the package launchable on Apple Silicon at all, so a build
      # that silently lost it must not ship. electron-builder only warns when it skips signing, which
      # would otherwise leave a package that fails to open on every arm64 Mac. The runner is arm64, so
      # --verify checks the slice that actually matters. Gatekeeper will still reject the app on the
      # user's machine — that is expected here, and only spctl would report it.
      - name: Verify ad-hoc signature
        if: env.SIGNING != 'true'
        run: |
          app=$(find dist-installer -maxdepth 2 -name 'Astera.app' -print -quit)
          if [ -z "$app" ]; then echo "Astera.app not found in dist-installer" >&2; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$app"
          if ! codesign -dvv "$app" 2>&1 | grep -q 'Signature=adhoc'; then
            echo "Expected an ad-hoc signature, got:" >&2
            codesign -dvv "$app" 2>&1 >&2
            exit 1
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            dist-installer/*.dmg
            dist-installer/*.dmg.blockmap
            dist-installer/*-mac.zip
            dist-installer/*-mac.zip.blockmap
            dist-installer/latest-mac.yml
          retention-days: 1

  # The Linux build and its clean-container check live in their own callable workflow. release.yml
  # runs only on a tag, so a job written inline here could not be tried before the release that
  # depends on it; linux-package.yml can be pushed and rehearsed, and this call runs that same file.
  # It also holds the reason the glibc floor is pinned by a container image rather than a runner
  # label. There is no signing step for Linux — no counterpart to SignPath or a Developer ID exists
  # for it, and that distribution channel does not expect one.
  linux:
    needs: validate
    uses: ./.github/workflows/linux-package.yml

  # The release is created as a draft and only made public once every asset is attached. That
  # ordering is the whole point: latest.yml / latest-mac.yml ARE the update feeds, so a half-built
  # release would advertise an installer that isn't there yet. policy.json rides along because the
  # app fetches it from releases/latest/download/policy.json.
  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      # Read by scripts/build-release-notes.cjs, which drops the Gatekeeper caveat from the notes
      # once macOS builds are notarized. Job-level env is inherited by every step, and it has to live
      # here rather than on the step because the secrets context is NOT available in a step's if: —
      # referencing it there makes the whole file an invalid workflow. Same shape as the macos job's
      # SIGNING.
      MAC_SIGNED: ${{ secrets.APPLE_CSC_LINK != '' && secrets.APPLE_ID != '' }}
    steps:
      # fetch-depth: 0 because the release notes are built from the commits since the previous tag —
      # the default shallow clone has neither the history to walk nor the tags to find the range in.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Restricted to the release-* artifacts: the windows job also uploads the intermediate
      # unsigned-binaries-${{ github.run_id }} and unsigned-installer-${{ github.run_id }} artifacts
      # when SignPath signing is configured, and the latter contains an unsigned *-setup.exe under the
      # SAME filename as the signed one inside release-windows. With merge-multiple flattening
      # everything into one directory, an unpatterned download would let either file win the
      # collision — if the unsigned one does, latest.yml (patched from the signed installer's sha512)
      # no longer matches what ships, so every electron-updater client fails the checksum and auto-
      # update breaks until the next release. unsigned-binaries.zip would also leak out as a public
      # release asset. Restricting to release-* avoids the intermediates entirely.
      # Downloaded into release-assets/, deliberately NOT assets/: the repository has an assets/
      # directory of its own (the README banner), which checkout has already put in place by now.
      # Uploading assets/* from there published banner.jpg next to the installers in v1.1.0. Keep
      # this path off any directory that exists in the repository.
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      # Notes come from scripts/build-release-notes.cjs rather than gh's --generate-notes: that flag
      # builds its list out of pull requests, and this repository commits straight to the branch, so
      # it yielded nothing but a Full Changelog link on every release through v1.0.3. The script
      # writes the WHOLE body, install caveats included — they used to be prepended by two further
      # steps here, which put three notices in front of the change list on every release page and
      # needed marker guards so a publish re-run would not stack a second copy of each.
      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ github.ref_name }}'
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --draft --title "$tag" \
              --notes "$(node scripts/build-release-notes.cjs "$tag")"
          gh release upload "$tag" release-assets/* policy.json --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit '${{ github.ref_name }}' --draft=false --latest
