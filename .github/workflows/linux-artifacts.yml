name: Linux artifacts

# Stage 1 of Linux support needs installable artifacts to hand-verify, and neither Windows nor
# macOS can produce a deb or an AppImage — electron-builder needs a Linux host. This is a
# verification tool, not a gate, so it deliberately does not run on every push. Stage 2 moves these
# steps into release.yml, where the artifacts become release assets instead.
on:
  workflow_dispatch:
  # Stage-1 scaffolding, scoped to the branch that introduces it. workflow_dispatch only becomes
  # available once this file reaches the default branch, so on this branch there is no way to ask for
  # a build — and stage 1's whole point is having an installable artifact to try. A push trigger fires
  # on the very commit that adds the file, and dies with the branch. It is deliberately not
  # `pull_request`: unscoped, that would run this build on every future PR against develop.
  push:
    branches: [feature/linux-build]

jobs:
  build:
    # Astera's declared Linux floor is Ubuntu 22.04 / Debian 12. Pinning to the oldest supported
    # distro, rather than `ubuntu-latest`, is what makes that floor true: a native module links
    # against whatever glibc symbol versions it happens to reference, capped by whatever glibc the
    # build host has installed. `ubuntu-latest` tracks the newest runner image (24.04, glibc 2.39)
    # and would raise the floor the moment a dependency starts referencing a newer symbol, silently
    # and without a failing build, breaking the app on 22.04 for part of the user base while CI
    # stays green. Building on 22.04 caps the linked symbol versions at what 22.04 itself provides.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # 22.12 is a hard floor, not a preference: @electron/rebuild and node-abi — which
      # `electron-builder install-app-deps` runs from postinstall — declare >=22.12.0.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # node-pty ships no linux prebuild (its prebuilds/ holds darwin-* and win32-* only), so this
      # compiles it with node-gyp. python3 and build-essential are preinstalled on this runner.
      - run: npm ci

      - run: npm run dist:linux

      # A build that produces an artifact nobody can start is still a green build — this exact
      # shape of failure has bitten this workflow twice already (an unstated glibc floor, then
      # missing ALSA/GBM shared-library dependencies), both silently: the deb installed cleanly and
      # the app never launched. This runner already has half the world installed, so a check run
      # directly on it would pass regardless of what the deb actually declares; only a clean
      # container — nothing preinstalled but the base OS — tests whether the package's own
      # dependencies are enough to satisfy the binary's dynamic linking on a real user machine. Two
      # distros are checked because Ubuntu 24.04 renamed libasound2 to libasound2t64 (the "t64"
      # 64-bit time_t transition) and left plain `libasound2` resolvable through more than one
      # provider, so the actual resolution on that distro needs confirming rather than assumed.
      - name: Verify the deb starts cleanly on a clean Ubuntu 22.04 container
        run: |
          docker run --rm -v "$PWD/dist-installer:/artifacts:ro" ubuntu:22.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends /artifacts/*.deb
            unresolved=$(ldd /opt/Astera/astera | grep "not found" || true)
            if [ -n "$unresolved" ]; then
              echo "Unresolved shared libraries on Ubuntu 22.04:"
              echo "$unresolved"
              exit 1
            fi
          '

      - name: Verify the deb starts cleanly on a clean Ubuntu 24.04 container
        run: |
          docker run --rm -v "$PWD/dist-installer:/artifacts:ro" ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends /artifacts/*.deb
            unresolved=$(ldd /opt/Astera/astera | grep "not found" || true)
            if [ -n "$unresolved" ]; then
              echo "Unresolved shared libraries on Ubuntu 24.04:"
              echo "$unresolved"
              exit 1
            fi
          '

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: linux-installers
          path: |
            dist-installer/*.AppImage
            dist-installer/*.deb
          # A silent empty upload would read as a successful build that produced nothing.
          if-no-files-found: error
