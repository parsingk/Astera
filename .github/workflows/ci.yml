name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Any branch, on demand. The triggers above cover main and PRs, so a feature branch gets no CI run
  # of its own — and Linux support needs the matrix green on the branch before a PR exists.
  workflow_dispatch:

# Runs on Windows, macOS and Linux because `npm ci` triggers `electron-builder install-app-deps`,
# which compiles node-pty against the Electron ABI with a platform-specific toolchain (MSVC on
# Windows, clang on macOS, gcc on Linux — node-pty ships no linux prebuild, so there it is a full
# node-gyp build). A successful build on one platform proves nothing about the others. If the build
# breaks here, it breaks in the release workflow too, so every platform must be tested.
#
# Running all three also matters for the suite itself, not just the native build. The tests were
# written on Windows and, until they were published, had never run anywhere else — so they had picked
# up assumptions that only hold there: that os.tmpdir() is already a canonical path (it is not, with
# 8.3 short names on the Windows runner and /var → /private/var on macOS), and that `\` is a path
# separator. Linux is the newest of the three and the one the suite has run on least, and it is the
# only case-sensitive filesystem of the three. Every platform has to run them or those assumptions
# come back.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # 22.12 is a hard floor, not a preference: @electron/rebuild and node-abi — which
      # `electron-builder install-app-deps` runs from postinstall — declare >=22.12.0.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # What machine this actually ran on. The "Runner Image" group above names the image but not its
      # size, and the size is what the suite's timing-sensitive tests care about: rolling.test.ts and
      # codexRolling.test.ts read real files under fake timers, so a slow enough runner makes an fs
      # callback miss its window (see settleIo). Core count also decides how many vitest workers
      # compete for the machine. When one of those tests fails here, this line is the difference
      # between knowing and guessing. node is used rather than nproc/sysctl because it is the one
      # thing already installed on all three.
      - name: Runner spec
        shell: bash
        run: node -e 'const os = require("node:os"); console.log(os.platform(), os.arch(), "|", os.cpus().length, "vCPU |", Math.round(os.totalmem() / 1024 ** 3), "GB RAM")'

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # MCP over HTTP against a real Host (docs/mcp.md). The test spawns the built `astera mcp http`
      # (out/main/cli.js), so `npm test` above, which runs before the build, skips it. It runs here by name,
      # and the step reads vitest's JSON report and fails unless that one test passed: a skip is a red step.
      - name: MCP over HTTP against a real Host
        timeout-minutes: 10
        shell: bash
        env:
          IT_FILE: src/cli/cliHost.integration.test.ts
          IT_NAME: 'over HTTP: the Host runs the entrance'
        run: |
          npx vitest run "$IT_FILE" -t "$IT_NAME" --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/mcp-http.json"
          node -e 'const r = require(process.argv[1]); const name = process.argv[2]; const hits = r.testResults.flatMap((f) => f.assertionResults).filter((t) => t.fullName.includes(name)); if (hits.length !== 1 || hits[0].status !== "passed") { console.error(`expected the test "${name}" to pass, got ${hits.map((t) => t.status).join(", ") || "no such test"}`); process.exit(1) }' "$RUNNER_TEMP/mcp-http.json" "$IT_NAME"

      # The agent app workspace against a real display (docs/agent-workspace-isolation.md). The unit
      # tests above drive every desk with fakes; these two start Xvfb or a background app for real.
      # They are gated on ASTERA_DESKTOP_E2E=1, so `npm test` collects and skips them. A run that skips
      # them here still exits 0, so each step reads vitest's JSON report afterward and fails unless every
      # test in the file passed (two on Linux, one on macOS): a gate that did not open is a red step.
      # After the build (preflight ruling F6), so a failing or flaky e2e never skips the build step.
      # Ten minutes each: a hung Xvfb, xdotool or ps would otherwise hold the job for GitHub's 6 h.
      #
      # The runtime libraries Electron loads are on the image already, since it ships Google Chrome;
      # they are named anyway, with the 24.04 (t64) package names, so a leaner image fails here and not
      # inside Electron.
      - name: Linux desktop tools for the agent workspace e2e
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          xvfb xdotool imagemagick
          libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1 libxtst6

      - name: Agent workspace e2e (Linux, Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        env:
          ASTERA_DESKTOP_E2E: '1'
          E2E_FILE: src/host/workspace/desktop.linux.e2e.test.ts
          E2E_EXPECT: '2'
        run: |
          npx vitest run "$E2E_FILE" --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/e2e.json"
          node -e 'const r = require(process.argv[1]); const want = Number(process.argv[2]); if (r.numTotalTests !== want || r.numPassedTests !== want) { console.error(`expected ${want} of ${want} e2e tests to pass, got ${r.numPassedTests} passed of ${r.numTotalTests} (${r.numPendingTests} skipped)`); process.exit(1) }' "$RUNNER_TEMP/e2e.json" "$E2E_EXPECT"

      - name: Agent workspace e2e (macOS, background)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        shell: bash
        env:
          ASTERA_DESKTOP_E2E: '1'
          E2E_FILE: src/host/workspace/desktop.mac.e2e.test.ts
          E2E_EXPECT: '1'
        run: |
          npx vitest run "$E2E_FILE" --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/e2e.json"
          node -e 'const r = require(process.argv[1]); const want = Number(process.argv[2]); if (r.numTotalTests !== want || r.numPassedTests !== want) { console.error(`expected ${want} of ${want} e2e tests to pass, got ${r.numPassedTests} passed of ${r.numTotalTests} (${r.numPendingTests} skipped)`); process.exit(1) }' "$RUNNER_TEMP/e2e.json" "$E2E_EXPECT"
