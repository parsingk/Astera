name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runs on both Windows and macOS because `npm ci` triggers `electron-builder install-app-deps`,
# which compiles node-pty against the Electron ABI with a platform-specific toolchain (MSVC on
# Windows, clang on macOS). A successful build on one platform proves nothing about the other.
# If the build breaks here, it breaks in the release workflow too, so both platforms must be tested.
#
# Running both also matters for the suite itself, not just the native build. The tests were written
# on Windows and, until they were published, had never run anywhere else — so they had picked up
# assumptions that only hold there: that os.tmpdir() is already a canonical path (it is not, with
# 8.3 short names on the Windows runner and /var → /private/var on macOS), and that `\` is a path
# separator. Both platforms have to run them or those assumptions come back.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # 22.12 is a hard floor, not a preference: @electron/rebuild and node-abi — which
      # `electron-builder install-app-deps` runs from postinstall — declare >=22.12.0.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
