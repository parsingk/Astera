# Signs the merged index. Started by hand by a maintainer on the main branch, never by a pull request; the signing key
# is its only secret.
name: sign
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate before signing
        run: astera plugins registry-validate --path index.json
      - name: Sign
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$REGISTRY_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          astera plugins registry-sign --path index.json --key-file "$RUNNER_TEMP/key.pem" --key-id main
          rm -f "$RUNNER_TEMP/key.pem"
      - name: Commit the signature
        run: |
          git config user.name "registry-signer"
          git config user.email "registry-signer@users.noreply.github.com"
          git add index.json.sig
          git commit -m "chore: sign index"
          git push
