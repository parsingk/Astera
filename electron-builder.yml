appId: io.github.parsingk.astera
productName: Astera
directories:
  output: dist-installer
files:
  - out/**
  # The ?asset icons imported by main (resources/icon.png, resources/tray.png) are resolved at
  # runtime through __dirname/../../resources, so resources must ship inside the package.
  - resources/**
  # logo-source.png is the input to scripts/gen-icon.ps1 and is never read at runtime.
  - '!resources/logo-source.png'
  # The skills directory also ships through extraResources below, and that is the copy the app reads
  # (skillsPath = process.resourcesPath/skills when packaged). Keeping it out of the asar avoids
  # shipping the same document twice.
  - '!resources/skills/**'
asarUnpack:
  - '**/node_modules/node-pty/**'
extraResources:
  # The orchestration CLI is bundled into main (out/main/cli.js) and is not copied here.
  # Only the skill document that `astera help` reads is shipped as a resource.
  - from: resources/skills
    to: skills
# Apache-2.0 section 4(a) requires recipients of the Work to be given a copy of the License, and the
# installer is a distribution of it. extraFiles (not extraResources) puts this at the application root,
# next to the LICENSE.electron.txt and LICENSES.chromium.html that electron-builder places there for the
# bundled runtime — the same place a user would look for the rest of the licensing.
extraFiles:
  - LICENSE
mac:
  target:
    - target: dmg
      arch: [universal]
    # zip isn't optional — electron-updater's macOS update path (Squirrel.Mac) only accepts zip.
    # dmg is for initial installs; auto-updates go through this zip.
    - target: zip
      arch: [universal]
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # A prerequisite for Gatekeeper and notarization. The moment this is on, entitlements becomes required.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  # Lets child processes (node-pty's spawn-helper, Electron's helpers) inherit the same entitlements.
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # Notarization. Reads the APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID env vars.
  # Forks that build without the secrets get this value overridden to false by the release workflow, so it passes (fail-open).
  notarize: true
  # @electron/universal merges the two architecture builds and expects files at the same path to be
  # byte-identical. node-pty's native artifacts differ per architecture, so the x64 side is kept separately.
  # node-pty@1.1.0 ships its per-architecture pty.node and spawn-helper under prebuilds/darwin-<arch>/
  # rather than node-gyp's build/Release/ — both architecture builds include the whole of node-pty via
  # asarUnpack anyway, so the other architecture's prebuild copy sits inside byte-identical either way.
  x64ArchFiles: '**/node_modules/node-pty/prebuilds/**'
dmg:
  # An asset name with no spaces — keeps percent-encoding out of release asset URLs (the same rule nsis follows).
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Space-free artifact name — keeps release asset URLs free of percent-encoding.
  artifactName: ${name}-${version}-setup.${ext}
publish:
  # Public GitHub Releases. electron-updater reads the feed straight from the releases API, so no
  # credentials are involved on the client side. electron-builder itself never publishes — the
  # release workflow builds with --publish never and attaches assets through `gh` (the split exists
  # so the installer can be code-signed between packaging and upload). This block still matters:
  # it is what generates app-update.yml, which tells the installed app where updates live.
  provider: github
  owner: parsingk
  repo: Astera
  releaseType: draft
