appId: io.github.parsingk.astera
productName: Astera
directories:
  output: dist-installer
files:
  - out/**
  # The ?asset icons imported by main (resources/icon.png, resources/tray.png) are resolved at
  # runtime through __dirname/../../resources, so resources must ship inside the package.
  - resources/**
  # logo-source.png is the input to scripts/gen-icon.ps1 and is never read at runtime.
  - '!resources/logo-source.png'
  # The skills directory also ships through extraResources below, and that is the copy the app reads
  # (skillsPath = process.resourcesPath/skills when packaged). Keeping it out of the asar avoids
  # shipping the same document twice.
  - '!resources/skills/**'
asarUnpack:
  - '**/node_modules/node-pty/**'
extraResources:
  # The orchestration CLI is bundled into main (out/main/cli.js) and is not copied here.
  # Only the skill document that `astera help` reads is shipped as a resource.
  - from: resources/skills
    to: skills
  # Apache-2.0 section 4(a) requires recipients of the Work to be given a copy of the License, and the
  # installer is a distribution of it.
  #
  # **This must be a resource, not an extraFile, because of macOS.** extraFiles copies to the
  # "application root", which on Windows is the install directory (next to Astera.exe and the
  # LICENSE.electron.txt the runtime ships) but on macOS is Astera.app/Contents. A loose file sitting
  # directly in Contents is not part of the bundle's sealed structure, so codesign rejects the whole
  # app with "a sealed resource is missing or invalid" — measured, and it fails the ad-hoc signing the
  # unsigned release path needs *and* the Developer ID signing the real path needs, which would block
  # macOS releases entirely. Contents/Resources is inside the seal, so this placement signs cleanly.
  #
  # Windows keeps its app-root copy through win.extraFiles below, so nothing changes there.
  - LICENSE
mac:
  target:
    - target: dmg
      arch: [universal]
    # zip isn't optional — electron-updater's macOS update path (Squirrel.Mac) only accepts zip.
    # dmg is for initial installs; auto-updates go through this zip.
    - target: zip
      arch: [universal]
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # A prerequisite for Gatekeeper and notarization. The moment this is on, entitlements becomes required.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  # Lets child processes (node-pty's spawn-helper, Electron's helpers) inherit the same entitlements.
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # Notarization. Reads the APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID env vars.
  # Forks that build without the secrets get this value overridden to false by the release workflow, so it passes (fail-open).
  notarize: true
  # @electron/universal merges the two architecture builds and expects files at the same path to be
  # byte-identical. node-pty's native artifacts differ per architecture, so the x64 side is kept separately.
  # node-pty@1.1.0 ships its per-architecture pty.node and spawn-helper under prebuilds/darwin-<arch>/
  # rather than node-gyp's build/Release/ — both architecture builds include the whole of node-pty via
  # asarUnpack anyway, so the other architecture's prebuild copy sits inside byte-identical either way.
  x64ArchFiles: '**/node_modules/node-pty/prebuilds/**'
dmg:
  # An asset name with no spaces — keeps percent-encoding out of release asset URLs (the same rule nsis follows).
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  target: nsis
  icon: build/icon.ico
  # Keeps LICENSE at the install root, next to Astera.exe and the LICENSE.electron.txt /
  # LICENSES.chromium.html that electron-builder places there for the bundled runtime — the same place
  # a user would look for the rest of the licensing. This used to be a top-level extraFiles; it is
  # win-only now because on macOS that same setting lands the file in Astera.app/Contents and breaks
  # code signing (see the extraResources comment above). The resources copy ships on both platforms.
  extraFiles:
    - LICENSE
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Space-free artifact name — keeps release asset URLs free of percent-encoding.
  artifactName: ${name}-${version}-setup.${ext}
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  # freedesktop category — the same role mac.category's public.app-category.developer-tools plays.
  category: Development
  # deb requires a maintainer and electron-builder cannot derive one from package.json's
  # `author: "parsingk"`, which carries no email — packaging fails outright without this. The address
  # is the one this repo's own commits use, so it satisfies the format without publishing a new one.
  maintainer: parsingk <17137357+parsingk@users.noreply.github.com>
  # A space-free artifact name, the same rule dmg and nsis follow — it keeps percent-encoding out of
  # release asset URLs.
  artifactName: ${name}-${version}-${arch}.${ext}
# The declared Linux floor is Ubuntu 22.04 / Debian 12 (see linux-artifacts.yml's runner pin). The
# pin and the `libc6` bound below are two halves of the same guarantee: the pin stops the artifact
# from ever needing more glibc than 22.04 provides (2.35; Debian 12's 2.36 also qualifies), and the
# bound stops apt from installing the deb somewhere it cannot run. Without it, the deb installs
# cleanly on an older system and only fails silently at launch, because node-pty's native module
# needs a newer glibc than that system has.
#
# Nine of these entries are not ours — they are electron-builder's own default deb `depends`
# (https://www.electron.build/configuration.html#linuxconfiguration, DebOptions.depends), repeated
# here verbatim. That repetition is required, not decorative: electron-builder's `depends` replaces
# its default list rather than merging with it — confirmed by reading electron-builder's
# app-builder-lib source (targets/FpmTarget.js), which only calls its internal getDefaultDepends()
# when `depends` is unset. Treat those nine as read-only, and if a future electron-builder upgrade
# changes its own defaults, this copy will not notice — reconcile it by hand.
#
# The other four are ours, added on top of that upstream list. Both `libasound2t64 | libasound2`
# and `libgbm1` exist because Electron links against ALSA and against Mesa's GBM, and
# electron-builder's own default list above omits both — verified by installing the deb into a
# clean container with nothing preinstalled and running `ldd` on `/opt/Astera/astera` (every
# bundled `.so` under app.asar.unpacked came back clean; only the app's own binary was short two
# libraries). The gap is upstream's, not a local mistake; do not remove these as "stray" entries
# during a future cleanup:
# - `libc6 (>= 2.35)` states the floor above (see linux-artifacts.yml's runner pin).
# - `libasound2t64 | libasound2` is an alternative dependency, not a single name, because of Ubuntu
#   24.04's `t64` (64-bit time_t) transition: it renamed the real ALSA package to `libasound2t64`
#   and left plain `libasound2` as a virtual package. A bare `libasound2` here would still resolve
#   on 24.04, but not necessarily to the ALSA library — checked, and apt was equally willing to
#   satisfy it with `liboss4-salsa-asound2` (an OSS-emulation shim, also `Provides: libasound2`),
#   which would have left `ldd` clean while audio silently ran through the wrong backend. Listing
#   `libasound2t64` first makes apt prefer the real package wherever it exists (24.04) and fall back
#   to plain `libasound2` where it does not (22.04, Debian 12).
# - `libgbm1` is a plain, unrenamed name on every distro this app targets (22.04, 24.04, Debian 12).
# - `libstdc++6` belongs to node-pty, not to Electron: of the ELF objects in the payload, only
#   `pty.node` links `libstdc++.so.6`, and the app binary does not. It is declared rather than left
#   implicit because nothing in CI can catch its absence — `libstdc++6` is installed in every base
#   image the container check uses, since `apt` itself depends on it, so an undeclared dependency
#   here resolves anyway and the check stays green. node-pty is imported at main startup, so a host
#   without it would get the same silent non-start the two earlier defects produced. Plain name: the
#   t64 transition did not rename this one.
#
# All four are exercised, per distro, by linux-artifacts.yml's post-build step, which installs the
# freshly built deb into a clean container and asserts `ldd` is clean on every ELF object it
# installs — the app binary, the bundled Electron libraries and node-pty's `pty.node`.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libc6 (>= 2.35)
    - libasound2t64 | libasound2
    - libgbm1
    - libstdc++6
publish:
  # Public GitHub Releases. electron-updater reads the feed straight from the releases API, so no
  # credentials are involved on the client side. electron-builder itself never publishes — the
  # release workflow builds with --publish never and attaches assets through `gh` (the split exists
  # so the installer can be code-signed between packaging and upload). This block still matters:
  # it is what generates app-update.yml, which tells the installed app where updates live.
  provider: github
  owner: parsingk
  repo: Astera
  releaseType: draft
